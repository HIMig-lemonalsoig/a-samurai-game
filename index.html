<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Way — A Samurai Roguelike</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; font-family: 'Georgia', 'Times New Roman', serif; color: #eee; user-select: none; cursor: default; }
  #canvas { display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }

  #crosshair {
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    transform: translate(-50%,-50%);
  }

  #bars { left: 28px; bottom: 28px; width: 280px; }
  .bar {
    height: 14px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.25);
    margin-bottom: 6px;
    position: relative;
    overflow: hidden;
  }
  .bar-fill { height: 100%; transition: width 0.18s ease-out; }
  .bar-fill.hp   { background: linear-gradient(90deg, #8a2828, #e85050); }
  .bar-fill.stam { background: linear-gradient(90deg, #b08838, #ffd060); }
  .bar-label {
    position: absolute; left: 8px; top: 0; line-height: 13px;
    font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.85);
    text-transform: uppercase; text-shadow: 0 0 2px #000;
  }

  #wave { right: 28px; bottom: 28px; text-align: right; }
  #wave .label { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.65; }
  #wave .num { font-size: 48px; font-weight: 700; line-height: 1; }
  #wave .kills { font-size: 11px; opacity: 0.55; margin-top: 4px; letter-spacing: 2px; }

  #hint {
    left: 50%; top: 62%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 22px;
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 0.25s;
    text-transform: uppercase;
    text-shadow: 0 0 6px #000, 0 0 18px rgba(255,180,80,0.6);
    color: #ffd070;
  }
  #hint.visible { opacity: 0.95; }

  #wave-banner {
    left: 0; right: 0; top: 28%;
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s;
  }
  #wave-banner.visible { opacity: 1; }
  #wave-banner .small {
    font-size: 12px; letter-spacing: 8px; opacity: 0.6;
    text-transform: uppercase;
  }
  #wave-banner .big {
    font-size: 56px; letter-spacing: 6px; margin-top: 10px;
    text-shadow: 0 0 12px rgba(0,0,0,0.8);
  }

  #menu, #death {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,15,10,0.85), rgba(0,0,0,0.97));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
    cursor: pointer;
    text-align: center;
  }
  #death { display: none; }

  #menu h1, #death h1 {
    font-size: 68px; letter-spacing: 12px;
    margin-bottom: 12px;
    text-shadow: 0 0 24px rgba(255,180,80,0.4);
  }
  #menu .sub, #death .sub {
    font-size: 13px; letter-spacing: 8px;
    opacity: 0.55;
    margin-bottom: 44px;
    text-transform: uppercase;
  }

  .controls {
    font-size: 13px;
    line-height: 2.1;
    opacity: 0.75;
    margin-bottom: 28px;
    text-align: left;
  }
  .controls b {
    color: #ffd070;
    display: inline-block;
    min-width: 110px;
    letter-spacing: 2px;
    font-weight: normal;
  }
  .cta {
    margin-top: 8px;
    padding: 12px 36px;
    border: 1px solid rgba(255,255,255,0.7);
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.3);
  }
  .cta:hover { background: rgba(255,255,255,0.08); }

  #death .stats {
    font-size: 17px;
    line-height: 2;
    margin-bottom: 32px;
    opacity: 0.9;
  }
  #death .stats b { color: #ffd070; font-weight: normal; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,0.65);
  }
  #hit-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: rgba(180, 20, 20, 0);
    transition: background 0.35s ease-out;
  }
  #hit-flash.active {
    background: rgba(180, 20, 20, 0.42);
    transition: background 0s;
  }
  #parry-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 7;
    background: rgba(255, 240, 200, 0);
    transition: background 0.4s ease-out;
  }
  #parry-flash.active {
    background: rgba(255, 240, 200, 0.45);
    transition: background 0s;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="vignette"></div>
<div id="hit-flash"></div>
<div id="parry-flash"></div>

<div id="crosshair" class="hud"></div>

<div id="bars" class="hud">
  <div class="bar"><div class="bar-fill hp"   id="hp-fill"   style="width:100%"></div><div class="bar-label">VIGOR</div></div>
  <div class="bar"><div class="bar-fill stam" id="stam-fill" style="width:100%"></div><div class="bar-label">RESOLVE</div></div>
</div>

<div id="wave" class="hud">
  <div class="label">Wave</div>
  <div class="num" id="wave-num">I</div>
  <div class="kills" id="kills-text">0 FALLEN</div>
</div>

<div id="hint" class="hud"></div>

<div id="wave-banner" class="hud">
  <div class="small" id="wave-small">A new wave approaches</div>
  <div class="big"   id="wave-big">Wave I</div>
</div>

<div id="menu">
  <h1>道</h1>
  <div class="sub">The Way — A Wanderer in the Bamboo</div>
  <div class="controls">
    <div><b>W A S D</b> Move</div>
    <div><b>MOUSE</b> Look</div>
    <div><b>LEFT CLICK</b> Slash</div>
    <div><b>RIGHT CLICK</b> Parry (timing matters)</div>
    <div><b>SHIFT</b> Sprint</div>
    <div><b>SPACE</b> Dodge (i-frames)</div>
    <div><b>F</b> Standoff strike</div>
  </div>
  <div class="cta">Click to begin</div>
</div>

<div id="death">
  <h1>YOU FELL</h1>
  <div class="sub">The wind carries on</div>
  <div class="stats" id="death-stats"></div>
  <div class="cta">Click to walk again</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ============================================================
//  RENDERER, SCENE, CAMERA
// ============================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd6c4a6);
scene.fog = new THREE.FogExp2(0xd6c4a6, 0.022);

const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, 0.05, 300);
scene.add(camera);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ============================================================
//  LIGHTING
// ============================================================
const sun = new THREE.DirectionalLight(0xffe0a8, 1.5);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xd6c4a6, 0x3a4830, 0.55));
scene.add(new THREE.AmbientLight(0x685848, 0.28));

// ============================================================
//  TERRAIN
// ============================================================
const groundGeo = new THREE.PlaneGeometry(320, 320, 40, 40);
{
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    p.setZ(i, Math.sin(x*0.11)*0.18 + Math.cos(y*0.13)*0.22 + (Math.random()-0.5)*0.06);
  }
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(
  groundGeo,
  new THREE.MeshStandardMaterial({ color: 0x506830, roughness: 1.0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Grass tufts
{
  const tuftGeo = new THREE.ConeGeometry(0.14, 0.42, 4);
  const tuftMat = new THREE.MeshStandardMaterial({ color: 0x6e8c40, roughness: 1.0 });
  const grass = new THREE.InstancedMesh(tuftGeo, tuftMat, 700);
  const m = new THREE.Object3D();
  for (let i = 0; i < 700; i++) {
    m.position.set((Math.random()-0.5)*160, 0.15, (Math.random()-0.5)*160);
    m.rotation.y = Math.random()*Math.PI*2;
    m.scale.setScalar(0.5 + Math.random()*1.4);
    m.updateMatrix();
    grass.setMatrixAt(i, m.matrix);
  }
  scene.add(grass);
}

// Stone lanterns scattered around
{
  const lanternGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const lanternMat = new THREE.MeshStandardMaterial({ color: 0x8a8276, roughness: 0.95 });
  for (let i = 0; i < 12; i++) {
    const a = Math.random()*Math.PI*2;
    const r = 12 + Math.random()*50;
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.3, 6), lanternMat);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.7, 6), lanternMat);
    const top  = new THREE.Mesh(lanternGeo, lanternMat);
    const cap  = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.25, 4), lanternMat);
    base.position.y = 0.15;
    post.position.y = 0.65;
    top.position.y = 1.25;
    cap.position.y = 1.65;
    cap.rotation.y = Math.PI/4;
    g.add(base, post, top, cap);
    g.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    g.castShadow = true;
    base.castShadow = top.castShadow = post.castShadow = cap.castShadow = true;
    scene.add(g);
  }
}

// ============================================================
//  BAMBOO FOREST
// ============================================================
function bambooStalkGeo() {
  const g = new THREE.CylinderGeometry(0.085, 0.105, 8, 8, 10);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    const bump = Math.sin(y*1.8) * 0.006;
    p.setX(i, p.getX(i) * (1+bump));
    p.setZ(i, p.getZ(i) * (1+bump));
  }
  g.computeVertexNormals();
  return g;
}
{
  const bamboo = new THREE.InstancedMesh(
    bambooStalkGeo(),
    new THREE.MeshStandardMaterial({ color: 0x9ab070, roughness: 0.8 }),
    450
  );
  bamboo.castShadow = true;
  const m = new THREE.Object3D();
  for (let i = 0; i < 450; i++) {
    const a = Math.random()*Math.PI*2;
    const r = 6 + Math.random()*95;
    m.position.set(Math.cos(a)*r, 4, Math.sin(a)*r);
    m.rotation.set((Math.random()-0.5)*0.08, Math.random()*Math.PI*2, (Math.random()-0.5)*0.08);
    m.scale.set(0.7 + Math.random()*0.6, 0.8 + Math.random()*0.5, 0.7 + Math.random()*0.6);
    m.updateMatrix();
    bamboo.setMatrixAt(i, m.matrix);
  }
  scene.add(bamboo);

  // Leafy clusters up top
  const leafGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4d6a30, roughness: 1.0, flatShading: true });
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, 240);
  for (let i = 0; i < 240; i++) {
    const a = Math.random()*Math.PI*2;
    const r = 6 + Math.random()*95;
    m.position.set(Math.cos(a)*r, 7 + Math.random()*2.5, Math.sin(a)*r);
    m.rotation.set(Math.random(), Math.random(), Math.random());
    m.scale.setScalar(0.6 + Math.random()*0.9);
    m.updateMatrix();
    leaves.setMatrixAt(i, m.matrix);
  }
  scene.add(leaves);
}

// ============================================================
//  SAKURA PETALS
// ============================================================
const PETAL_COUNT = 500;
const petalGeo = new THREE.BufferGeometry();
const petalPos = new Float32Array(PETAL_COUNT*3);
const petalVel = new Float32Array(PETAL_COUNT*3);
for (let i = 0; i < PETAL_COUNT; i++) {
  petalPos[i*3+0] = (Math.random()-0.5)*80;
  petalPos[i*3+1] = Math.random()*14 + 1;
  petalPos[i*3+2] = (Math.random()-0.5)*80;
  petalVel[i*3+0] = (Math.random()-0.5)*0.25;
  petalVel[i*3+1] = -0.15 - Math.random()*0.12;
  petalVel[i*3+2] = (Math.random()-0.5)*0.25;
}
petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));
const petals = new THREE.Points(
  petalGeo,
  new THREE.PointsMaterial({ color: 0xffc0d8, size: 0.22, transparent: true, opacity: 0.85, depthWrite: false })
);
scene.add(petals);

// ============================================================
//  PLAYER + KATANA
// ============================================================
const player = {
  pos: new THREE.Vector3(0, 1.72, 0),
  yaw: 0, pitch: 0,
  hp: 100, maxHp: 100,
  stam: 100, maxStam: 100,
  attacking: false,
  attackT: 0,
  attackHit: false,
  parrying: false,
  parryT: 0,
  dodge: 0,
  iframes: 0,
  alive: true,
};

const katana = new THREE.Group();
{
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0xeaeaf0, metalness: 0.9, roughness: 0.18 });
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.92), bladeMat);
  blade.position.z = -0.46;
  // Slight curve illusion via bevel mesh on top
  const edge = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.04, 0.92), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05 }));
  edge.position.set(0, 0.02, -0.46);
  katana.add(blade, edge);

  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.045, 0.045), new THREE.MeshStandardMaterial({ color: 0x1c1818, roughness: 0.7 }));
  katana.add(guard);

  const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.24, 8), new THREE.MeshStandardMaterial({ color: 0x4a1e1e, roughness: 0.85 }));
  hilt.rotation.x = Math.PI/2;
  hilt.position.z = 0.13;
  katana.add(hilt);

  // Wrap rings on hilt
  for (let i = 0; i < 4; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.029, 0.005, 4, 12),
      new THREE.MeshStandardMaterial({ color: 0x18120e })
    );
    ring.rotation.y = Math.PI/2;
    ring.position.z = 0.05 + i*0.05;
    katana.add(ring);
  }
}
const KATANA_REST = { pos: new THREE.Vector3(0.35, -0.34, -0.5), rot: new THREE.Euler(-0.32, -0.18, 0.12) };
katana.position.copy(KATANA_REST.pos);
katana.rotation.copy(KATANA_REST.rot);
camera.add(katana);

// ============================================================
//  ENEMIES
// ============================================================
class Enemy {
  constructor(elite = false, spawnRadius = 16) {
    this.elite = elite;
    this.maxHp = elite ? 65 : 32;
    this.hp = this.maxHp;
    this.dmg = elite ? 24 : 14;
    this.speed = elite ? 3.4 : 2.5;
    this.attackRange = 2.1;
    this.cooldown = elite ? 0.8 : 1.4;
    this.telegraph = elite ? 0.45 : 0.7;
    this.attackState = 'idle';      // idle | windup | strike | recover
    this.attackTimer = 0;
    this.stagger = 0;
    this.dead = false;
    this.deathT = 0;
    this.flashT = 0;

    const g = new THREE.Group();
    const bodyColor = elite ? 0x5a1818 : 0x2c3438;
    const robe = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.85 });
    const skin = new THREE.MeshStandardMaterial({ color: 0xd8b89a, roughness: 0.8 });
    const trim = new THREE.MeshStandardMaterial({ color: elite ? 0xc0a040 : 0x707070, roughness: 0.6 });

    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.85, 4, 10), robe);
    torso.position.y = 1.05; torso.castShadow = true;
    g.add(torso);

    const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.18, 0.45), robe);
    shoulders.position.y = 1.55;
    g.add(shoulders);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 14, 14), skin);
    head.position.y = 1.78; head.castShadow = true;
    g.add(head);

    // Conical kasa hat
    const hat = new THREE.Mesh(
      new THREE.ConeGeometry(0.46, 0.28, 18, 1, true),
      new THREE.MeshStandardMaterial({ color: 0x6a5230, roughness: 0.95, side: THREE.DoubleSide })
    );
    hat.position.y = 1.96;
    g.add(hat);

    // Belt
    const belt = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.12, 0.5), trim);
    belt.position.y = 0.85;
    g.add(belt);

    // Sword
    const swordMat = new THREE.MeshStandardMaterial({ color: 0xeaeaf0, metalness: 0.9, roughness: 0.2 });
    const sword = new THREE.Group();
    const sBlade = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 1.0), swordMat);
    sBlade.position.z = -0.5;
    sword.add(sBlade);
    sword.position.set(0.4, 1.25, 0.0);
    sword.rotation.x = -0.6;
    g.add(sword);
    this.sword = sword;
    this.bodyParts = [torso, shoulders, head];

    // Spawn position
    const a = Math.random()*Math.PI*2;
    const d = spawnRadius + Math.random()*8;
    g.position.set(player.pos.x + Math.cos(a)*d, 0, player.pos.z + Math.sin(a)*d);
    this.mesh = g;
    scene.add(g);
  }

  update(dt) {
    if (this.flashT > 0) {
      this.flashT -= dt;
      const f = Math.max(0, this.flashT / 0.12);
      for (const m of this.bodyParts) m.material.emissive.setRGB(f, f*0.3, f*0.3);
    }

    if (this.dead) {
      this.deathT += dt;
      this.mesh.rotation.x = Math.min(Math.PI/2, this.deathT*4);
      this.mesh.position.y = Math.max(-0.4, -this.deathT*0.3);
      return;
    }
    if (this.stagger > 0) { this.stagger -= dt; return; }

    const toPlayer = new THREE.Vector3(
      player.pos.x - this.mesh.position.x, 0,
      player.pos.z - this.mesh.position.z
    );
    const dist = toPlayer.length();
    if (dist > 0.001) toPlayer.divideScalar(dist);
    this.mesh.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

    if (this.attackState === 'windup') {
      this.attackTimer -= dt;
      const t = 1 - (this.attackTimer / this.telegraph);
      this.sword.rotation.x = -0.6 - t*1.7;
      this.sword.rotation.z =  t*0.4;
      if (this.attackTimer <= 0) {
        this.attackState = 'strike';
        this.attackTimer = 0.15;
        if (dist < this.attackRange + 0.5) {
          handleEnemyStrike(this);
        }
      }
      return;
    }
    if (this.attackState === 'strike') {
      this.attackTimer -= dt;
      this.sword.rotation.x = -0.6 + (1 - this.attackTimer/0.15)*2.0;
      if (this.attackTimer <= 0) {
        this.attackState = 'recover';
        this.attackTimer = this.cooldown;
      }
      return;
    }
    if (this.attackState === 'recover') {
      this.attackTimer -= dt;
      // ease sword back to rest
      this.sword.rotation.x += (-0.6 - this.sword.rotation.x) * dt*5;
      this.sword.rotation.z += (0 - this.sword.rotation.z) * dt*5;
      if (this.attackTimer <= 0) this.attackState = 'idle';
    }

    if (dist > this.attackRange) {
      this.mesh.position.x += toPlayer.x * this.speed * dt;
      this.mesh.position.z += toPlayer.z * this.speed * dt;
      this.mesh.position.y = Math.abs(Math.sin(performance.now()*0.006 + this.mesh.id))*0.06;
    } else if (this.attackState === 'idle') {
      this.attackState = 'windup';
      this.attackTimer = this.telegraph;
    }
  }

  hit(dmg) {
    if (this.dead) return;
    this.hp -= dmg;
    this.stagger = 0.22;
    this.attackState = 'recover';
    this.attackTimer = 0.4;
    this.flashT = 0.12;
    if (this.hp <= 0) {
      this.dead = true;
    }
  }
}

let enemies = [];

// ============================================================
//  AUDIO (WebAudio synth)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
}
function tone(freq, dur, type='sine', gain=0.06, freqEnd=null) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  if (freqEnd !== null) {
    o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), audioCtx.currentTime + dur);
  }
  g.gain.value = gain;
  g.gain.setValueAtTime(gain, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur + 0.02);
}
function sndSwing()  { tone(360, 0.10, 'sine', 0.05, 120); }
function sndHit()    { tone(180, 0.18, 'square', 0.07, 60); }
function sndClang()  { tone(1500, 0.16, 'triangle', 0.12, 700); setTimeout(()=>tone(900, 0.12, 'triangle', 0.08, 500), 25); }
function sndParry()  { tone(2200, 0.22, 'triangle', 0.18, 800); setTimeout(()=>tone(1200, 0.18, 'triangle', 0.12, 500), 30); }
function sndDeath()  { tone(120, 0.6, 'sawtooth', 0.12, 40); }
function sndDodge()  { tone(400, 0.08, 'sine', 0.04, 200); }
function sndStandoff(){ tone(3000, 0.3, 'triangle', 0.18, 1500); setTimeout(()=>tone(400, 0.4, 'sawtooth', 0.1, 80), 100); }

// ============================================================
//  INPUT
// ============================================================
const keys = {};
let active = false;            // game accepting input
let pointerLocked = false;     // true mouselook; if false, we fall back to in-canvas tracking

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!active) return;
  if (e.code === 'KeyF') tryStandoff();
  if (e.code === 'Space') tryDodge();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let lastMouseX = innerWidth/2, lastMouseY = innerHeight/2;
addEventListener('mousemove', e => {
  if (!active) return;
  let dx, dy;
  if (pointerLocked) {
    dx = e.movementX; dy = e.movementY;
  } else {
    dx = e.clientX - lastMouseX;
    dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
  player.yaw -= dx * 0.0024;
  player.pitch -= dy * 0.0024;
  const lim = Math.PI/2 - 0.02;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
});
canvas.addEventListener('mousedown', e => {
  if (!active) return;
  if (e.button === 0) tryAttack();
  if (e.button === 2) tryParry();
});
addEventListener('mouseup', e => {
  if (e.button === 2) player.parrying = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

const menu = document.getElementById('menu');
const deathScreen = document.getElementById('death');

function startGame() {
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    try { audioCtx.resume(); } catch (e) {}
  }
  active = true;
  menu.style.display = 'none';
  deathScreen.style.display = 'none';
  document.body.style.cursor = 'none';
  lastMouseX = innerWidth/2;
  lastMouseY = innerHeight/2;
  try { canvas.requestPointerLock(); } catch (e) {}
}
menu.addEventListener('click', startGame);
deathScreen.addEventListener('click', () => { restart(); startGame(); });

document.addEventListener('pointerlockchange', () => {
  pointerLocked = (document.pointerLockElement === canvas);
});
document.addEventListener('pointerlockerror', () => {
  pointerLocked = false;
});

// ============================================================
//  COMBAT ACTIONS
// ============================================================
function tryAttack() {
  if (player.attacking || player.stam < 14 || player.dodge > 0 || !player.alive) return;
  player.attacking = true;
  player.attackT = 0;
  player.attackHit = false;
  player.stam = Math.max(0, player.stam - 14);
  sndSwing();
}
function tryParry() {
  if (player.stam < 10 || player.dodge > 0 || !player.alive) return;
  player.parrying = true;
  player.parryT = 0;
  player.stam = Math.max(0, player.stam - 8);
}
function tryDodge() {
  if (player.stam < 22 || player.dodge > 0 || !player.alive) return;
  player.dodge = 0.32;
  player.iframes = 0.28;
  player.stam = Math.max(0, player.stam - 22);
  sndDodge();
}

function damagePlayer(amt) {
  if (player.iframes > 0 || !player.alive) return;
  player.hp = Math.max(0, player.hp - amt);
  flashEl('hit-flash');
  sndHit();
  if (player.hp <= 0) onDeath();
}

function flashEl(id) {
  const el = document.getElementById(id);
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 60);
}

let timeScale = 1;
function slowmo(durMs = 280) {
  timeScale = 0.25;
  setTimeout(() => { timeScale = 1; }, durMs);
}

function handleEnemyStrike(enemy) {
  if (!player.alive) return;
  if (player.iframes > 0) return; // dodged
  if (player.parrying && player.parryT < 0.22) {
    // Perfect parry — open enemy for big counter
    enemy.stagger = 1.3;
    enemy.attackState = 'recover';
    enemy.attackTimer = 1.3;
    flashEl('parry-flash');
    sndParry();
    slowmo();
    return;
  }
  if (player.parrying) {
    player.stam = Math.max(0, player.stam - 22);
    sndClang();
    return;
  }
  damagePlayer(enemy.dmg);
}

// ============================================================
//  STANDOFF MECHANIC
// ============================================================
let standoffTarget = null;
let standoffT = 0;
let standoffCooldown = 0;

function maybeOfferStandoff() {
  if (standoffTarget || standoffCooldown > 0) return;
  // Find a single approaching enemy in a sweet zone, no other close threats
  let candidate = null;
  let nearbyClose = 0;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = e.mesh.position.distanceTo(player.pos);
    if (d < 5) nearbyClose++;
    if (d > 6 && d < 11 && (!candidate || d < candidate.mesh.position.distanceTo(player.pos))) {
      candidate = e;
    }
  }
  if (candidate && nearbyClose === 0 && Math.random() < 0.5) {
    standoffTarget = candidate;
    standoffT = 1.35;
    showHint('STANDOFF — Press F');
  }
}
function tryStandoff() {
  if (!standoffTarget) return;
  // Sweet window: middle ~50% of the time bar
  if (standoffT > 0.45 && standoffT < 0.95) {
    standoffTarget.hp = 0;
    standoffTarget.dead = true;
    standoffTarget.flashT = 0.12;
    kills++;
    sndStandoff();
    slowmo(380);
    showHint('— A CLEAN CUT —');
    setTimeout(hideHint, 900);
  } else {
    damagePlayer(12);
    showHint('Mistimed');
    setTimeout(hideHint, 700);
  }
  standoffTarget = null;
  standoffCooldown = 8 + Math.random()*4;
  updateUI();
}

// ============================================================
//  UI
// ============================================================
const hpFill = document.getElementById('hp-fill');
const stamFill = document.getElementById('stam-fill');
const waveNum = document.getElementById('wave-num');
const killsText = document.getElementById('kills-text');
const hintEl = document.getElementById('hint');
const banner = document.getElementById('wave-banner');
const bannerBig = document.getElementById('wave-big');
const bannerSmall = document.getElementById('wave-small');

function updateUI() {
  hpFill.style.width = (player.hp/player.maxHp*100)+'%';
  stamFill.style.width = (player.stam/player.maxStam*100)+'%';
  waveNum.textContent = romanize(wave);
  killsText.textContent = kills + ' FALLEN';
}
function romanize(n) {
  const r = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
  return r[n] || String(n);
}
function showHint(text) {
  hintEl.textContent = text;
  hintEl.classList.add('visible');
}
function hideHint() { hintEl.classList.remove('visible'); }
function showWaveBanner(text, sub) {
  bannerBig.textContent = text;
  if (sub) bannerSmall.textContent = sub;
  banner.classList.add('visible');
  setTimeout(() => banner.classList.remove('visible'), 2400);
}

// ============================================================
//  WAVE SYSTEM
// ============================================================
let wave = 0;
let kills = 0;
function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
let bestWave  = parseInt(safeGet('samurai-best-wave')  || '0', 10);
let bestKills = parseInt(safeGet('samurai-best-kills') || '0', 10);
let waveBreakTimer = 0;

function startWave() {
  wave++;
  const count = Math.min(9, 1 + Math.floor(wave * 0.7));
  const eliteChance = Math.min(0.55, (wave-1) * 0.11);
  for (let i = 0; i < count; i++) {
    const isElite = wave > 1 && Math.random() < eliteChance;
    enemies.push(new Enemy(isElite, 16 + Math.random()*6));
  }
  showWaveBanner('Wave ' + romanize(wave), wave === 1 ? 'The bamboo stirs' : 'They come again');
  updateUI();
}

function checkWaveEnd(dt) {
  if (waveBreakTimer > 0) {
    waveBreakTimer -= dt;
    if (waveBreakTimer <= 0) {
      // Clean out dead corpses
      for (const e of enemies) scene.remove(e.mesh);
      enemies = [];
      startWave();
    }
    return;
  }
  if (enemies.length > 0 && enemies.every(e => e.dead)) {
    waveBreakTimer = 2.5;
    // Reward: heal a little, full stamina
    player.hp = Math.min(player.maxHp, player.hp + 18);
    player.stam = player.maxStam;
  }
}

function onDeath() {
  if (!player.alive) return;
  player.alive = false;
  sndDeath();
  if (wave > bestWave) { bestWave = wave; safeSet('samurai-best-wave', String(bestWave)); }
  if (kills > bestKills) { bestKills = kills; safeSet('samurai-best-kills', String(bestKills)); }
  setTimeout(() => {
    active = false;
    document.body.style.cursor = 'default';
    if (document.pointerLockElement) document.exitPointerLock();
    document.getElementById('death-stats').innerHTML =
      `Waves survived <b>${wave}</b><br>Fallen by your blade <b>${kills}</b><br>—<br>Best run <b>${bestWave}</b> waves · <b>${bestKills}</b> kills`;
    deathScreen.style.display = 'flex';
  }, 1100);
}

function restart() {
  for (const e of enemies) scene.remove(e.mesh);
  enemies = [];
  player.pos.set(0, 1.72, 0);
  player.yaw = 0; player.pitch = 0;
  player.hp = player.maxHp;
  player.stam = player.maxStam;
  player.attacking = false;
  player.parrying = false;
  player.dodge = 0;
  player.iframes = 0;
  player.alive = true;
  wave = 0;
  kills = 0;
  standoffTarget = null;
  standoffCooldown = 0;
  waveBreakTimer = 0;
  startWave();
  updateUI();
}

// ============================================================
//  UPDATE FUNCTIONS
// ============================================================
const tmpForward = new THREE.Vector3();

function updatePlayer(dt) {
  // Stamina regen (slower while attacking/parrying)
  const regen = (player.parrying || player.attacking) ? 8 : 26;
  player.stam = Math.min(player.maxStam, player.stam + regen * dt);
  if (player.iframes > 0) player.iframes -= dt;

  if (!player.alive) {
    // Slowly collapse camera
    camera.position.y -= dt * 0.6;
    camera.rotation.z += dt * 0.3;
    return;
  }

  // Movement direction in world space
  const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
  const right   = new THREE.Vector3(forward.z, 0, -forward.x);
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.sub(forward);
  if (keys['KeyS']) move.add(forward);
  if (keys['KeyA']) move.sub(right);
  if (keys['KeyD']) move.add(right);
  if (move.lengthSq() > 0) move.normalize();

  let speed = 4.6;
  if (keys['ShiftLeft'] && player.stam > 0 && move.lengthSq() > 0) {
    speed = 7.4;
    player.stam = Math.max(0, player.stam - 9 * dt);
  }

  if (player.dodge > 0) {
    player.dodge -= dt;
    speed = 16;
    if (move.lengthSq() === 0) { move.copy(forward).negate(); }
  }

  player.pos.x += move.x * speed * dt;
  player.pos.z += move.z * speed * dt;
  // Keep inside bamboo arena
  const r = Math.hypot(player.pos.x, player.pos.z);
  if (r > 95) {
    player.pos.x *= 95/r;
    player.pos.z *= 95/r;
  }

  // Head bob
  const t = performance.now() * 0.012;
  const bobY = move.lengthSq() > 0 ? Math.sin(t) * 0.04 : 0;
  const bobX = move.lengthSq() > 0 ? Math.cos(t*0.5) * 0.02 : 0;

  camera.position.set(player.pos.x + bobX, player.pos.y + bobY, player.pos.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = 0;

  if (player.parrying) {
    player.parryT += dt;
    if (player.parryT > 0.55) player.parrying = false;
  }

  updateUI();
}

function updateKatana(dt) {
  if (!player.alive) return;
  if (player.attacking) {
    player.attackT += dt;
    const dur = 0.36;
    const t = Math.min(1, player.attackT / dur);
    const arc = Math.sin(t*Math.PI);
    // Diagonal slash from upper right to lower left
    katana.position.set(
      KATANA_REST.pos.x - arc*0.35,
      KATANA_REST.pos.y + arc*0.25,
      KATANA_REST.pos.z - arc*0.22
    );
    katana.rotation.set(
      KATANA_REST.rot.x + arc*1.3,
      KATANA_REST.rot.y + arc*0.7,
      KATANA_REST.rot.z - arc*1.5
    );
    // Hit window mid-swing
    if (t > 0.3 && t < 0.65 && !player.attackHit) {
      doSlashHit();
      player.attackHit = true;
    }
    if (t >= 1) {
      player.attacking = false;
      katana.position.copy(KATANA_REST.pos);
      katana.rotation.copy(KATANA_REST.rot);
    }
  } else if (player.parrying) {
    // Sword raised across body
    katana.position.set(0.02, -0.18, -0.55);
    katana.rotation.set(-0.15, -1.35, -0.25);
  } else {
    // Idle sway
    const tt = performance.now() * 0.0015;
    katana.position.set(
      KATANA_REST.pos.x + Math.sin(tt) * 0.006,
      KATANA_REST.pos.y + Math.cos(tt*1.3) * 0.005,
      KATANA_REST.pos.z
    );
    katana.rotation.copy(KATANA_REST.rot);
  }
}

function doSlashHit() {
  tmpForward.set(0, 0, -1).applyQuaternion(camera.quaternion);
  tmpForward.y = 0;
  tmpForward.normalize();
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.mesh.position.x - player.pos.x;
    const dz = e.mesh.position.z - player.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 2.6) continue;
    const dot = (dx/dist) * tmpForward.x + (dz/dist) * tmpForward.z;
    if (dot < 0.5) continue;
    const dmg = e.stagger > 0 ? 70 : 20;
    e.hit(dmg);
    sndClang();
    if (e.dead) {
      kills++;
      updateUI();
    }
  }
}

function updateEnemies(dt) {
  for (const e of enemies) e.update(dt);
}

function updatePetals(dt) {
  const p = petalGeo.attributes.position.array;
  const px = player.pos.x, pz = player.pos.z;
  for (let i = 0; i < PETAL_COUNT; i++) {
    p[i*3+0] += petalVel[i*3+0] * dt * 60;
    p[i*3+1] += petalVel[i*3+1] * dt * 60;
    p[i*3+2] += petalVel[i*3+2] * dt * 60;
    if (p[i*3+1] < 0 || Math.abs(p[i*3]-px) > 50 || Math.abs(p[i*3+2]-pz) > 50) {
      p[i*3+0] = px + (Math.random()-0.5)*70;
      p[i*3+1] = 12 + Math.random()*4;
      p[i*3+2] = pz + (Math.random()-0.5)*70;
    }
  }
  petalGeo.attributes.position.needsUpdate = true;
}

// ============================================================
//  MAIN LOOP
// ============================================================
let last = performance.now();
let frameN = 0;

function loop(now) {
  const rawDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = rawDt * timeScale;
  frameN++;

  if (active) {
    updatePlayer(dt);
    updateEnemies(dt);
    updateKatana(dt);
    updatePetals(rawDt);
    checkWaveEnd(dt);
    if (standoffCooldown > 0) standoffCooldown -= dt;
    if (standoffTarget) {
      standoffT -= dt;
      if (standoffT <= 0) {
        standoffTarget = null;
        hideHint();
      }
    } else if (frameN % 30 === 0) {
      maybeOfferStandoff();
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

restart();
updateUI();
requestAnimationFrame(loop);
</script>
